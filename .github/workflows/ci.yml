name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET tests
        run: dotnet test Ventilationsservice.slnx --configuration Release

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Ventilationsservice.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/Ventilationsservice.Web

      - name: Build frontend
        run: npm run build
        working-directory: src/Ventilationsservice.Web
